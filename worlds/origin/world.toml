id = "origin"
name = "Origin"
starting_room = "origin_plaza"

[[facts]]
id = "heard_about_old_observatory"

[[quests]]
id = "lights_in_the_old_observatory"
name = "Lights in the Old Observatory"
description = "Investigate the strange lights reported near the abandoned observatory."
starting_step = "obtain_rusty_key"

[[quests.steps]]
id = "obtain_rusty_key"
description = "Obtain the rusty key from Origin Plaza."
objective = { type = "possess_item", item = "rusty_key" }
next_step = "reach_old_observatory"

[[quests.steps]]
id = "reach_old_observatory"
description = "Find the old observatory."
objective = { type = "reach_room", room = "old_observatory" }
next_step = "report_to_mara"

[[quests.steps]]
id = "report_to_mara"
description = "Return to Mara Voss and ask her about the old observatory."
objective = { type = "ask_topic", npc = "mara_voss", topic = "old_observatory" }

[[items]]
id = "rusty_key"
name = "Rusty Key"
description = "A small iron key mottled with reddish-brown rust."

[[items]]
id = "forest_rusty_key"
name = "Rusty Key"
description = "A long-neglected key, green with age beneath its patches of rust."

[[features]]
id = "founders_plaque"
name = "Founder's Plaque"
room_description = "The Founder's Plaque is displayed elegantly on a central podium."
description = "A weathered bronze plaque commemorating the founding of Origin Plaza."

[[features]]
id = "rusty_key_relief"
name = "Rusty-Key"
room_description = "A relief carved into the podium depicts an oversized rusty key."
description = "The stone relief portrays a rusty key surrounded by an unfamiliar constellation."

[[npcs]]
id = "mara_voss"
name = "Mara Voss"
room_description = "Mara Voss tends the tavern from behind the old wooden bar."
description = "A sharp-eyed innkeeper in a weathered coat, Mara watches the room with practiced calm."
greeting = "Welcome to the Rusty Tavern. If you're newly arrived, the plaza is west of here."

[[npcs.topics]]
id = "origin_plaza"
name = "Origin Plaza"
response = "Origin Plaza is just west of here. Most new arrivals find their bearings there before venturing farther."

[[npcs.topics]]
id = "rusty_tavern"
name = "the Rusty Tavern"
response = "The tavern is old, but its doors stay open to travelers who bring more stories than trouble."

[[npcs.topics]]
id = "strange_lights"
name = "the strange lights"
response = "Travelers sometimes report lights moving beneath the old observatory's broken dome."
excludes_facts = ["heard_about_old_observatory"]
grants_facts = ["heard_about_old_observatory"]

[[npcs.topics]]
id = "old_observatory"
name = "the old observatory"
response = "Keep your voice down. The old observatory is supposed to be abandoned, but lights still move behind its broken dome."
requires_facts = ["heard_about_old_observatory"]
starts_quests = ["lights_in_the_old_observatory"]

[[rooms]]
id = "origin_plaza"
name = "Origin Plaza"
description = "The arrival zone of this world."
items = ["rusty_key"]
features = ["founders_plaque", "rusty_key_relief"]

[rooms.exits]
north = "forest_path"
east = "rusty_tavern"

[[rooms]]
id = "forest_path"
name = "Forest Path"
description = "Tall trees crowd around a narrow beaten trail."
items = ["forest_rusty_key"]

[rooms.exits]
south = "origin_plaza"
east = { destination = "old_observatory", requires_item = "rusty_key", failure_message = "The observatory door is locked. Its corroded keyhole looks oddly familiar." }

[[rooms]]
id = "old_observatory"
name = "Old Observatory"
description = "A fractured dome hangs above a circular chamber lined with silent brass instruments."

[rooms.exits]
west = "forest_path"

[[rooms]]
id = "rusty_tavern"
name = "Rusty Tavern"
description = "A worn but welcoming tavern. A fire crackles beside an old wooden bar."
npcs = ["mara_voss"]

[rooms.exits]
west = "origin_plaza"

